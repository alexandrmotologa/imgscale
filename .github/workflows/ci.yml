name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    name: Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies & build UI
        run: |
          cd web
          npm ci
          npm run build
          cd ..
          mkdir -p internal/ui/dist
          cp -r web/dist/* internal/ui/dist/

      - name: Run Go Tests
        run: go test -v -race ./...

      - name: Build imgscale binary
        run: go build -v -ldflags="-s -w" -o bin/imgscale ./cmd/imgscale

      - name: Verify CLI bench
        run: ./bin/imgscale bench --image ./testdata/portrait.png --n 5
